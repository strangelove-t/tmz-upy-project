[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tamizaje-upy"
version = "0.1.0"
description = "Aplicación local de tamizaje y orientación de la UPY"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "reportlab>=4.2,<5",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
